# Rebuilds the website and publishes it to GitHub Pages every time main changes.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:        # lets you re-run it by hand from the Actions tab

permissions:
  contents: read
  pages: write              # allowed to publish to Pages
  id-token: write           # proves to Pages that this run is really from this repo

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4                 # 1. get the repo files
      - uses: actions/setup-python@v5             # 2. install Python
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt      # 3. install MkDocs Material
      - run: mkdocs build --strict                # 4. markdown -> HTML in site/ (fail on broken links)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3    # 5. hand site/ to GitHub Pages
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4             # 6. put it live
