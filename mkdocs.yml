site_name: DAA Study Hub
site_description: Beginner-friendly study notes for CS332 Design and Analysis of Algorithms
site_url: https://iwhozaifa.github.io/daa-study-hub/
repo_url: https://github.com/iwhozaifa/daa-study-hub
edit_uri: edit/main/notes/

# Our markdown lives in notes/ instead of the default docs/
docs_dir: notes

theme:
  name: material
  features:
    - navigation.tabs        # top-level sections as tabs
    - navigation.sections
    - navigation.top         # "back to top" button
    - navigation.footer      # previous / next page links
    - search.highlight
    - search.suggest
    - content.tabs.link      # picking "Visual" on one page picks it everywhere
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition               # note / tip / warning boxes
  - pymdownx.details         # ??? collapsible boxes (hidden answers)
  - pymdownx.superfences:    # code blocks + Mermaid diagrams
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:         # === "Visual" content tabs (the 4 study modes)
      alternate_style: true
  - pymdownx.arithmatex:     # $math$ rendered by MathJax
      generic: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Plan:
      - Study plan: study-plan.md
      - Progress: progress.md
  - Topics:
      - 0 · Math toolkit: topics/00-math-toolkit.md
      - 1 · Algorithms & counting steps: topics/01-algorithms-and-counting.md
      - 2 · Proof techniques: topics/02-proof-techniques.md
      - 3 · Loop invariants & correctness: topics/03-correctness.md
      - 4 · Insertion sort: topics/04-insertion-sort.md
      - 5 · Loop analysis & space: topics/05-loop-analysis-and-space.md
      - 6 · Big-O, Ω, Θ: topics/06-asymptotic-notation.md
      - 7 · Divide & conquer + merge sort: topics/07-divide-and-conquer.md
      - 8 · Recurrences: topics/08-recurrences.md
  - Toolbox:
      - Cheatsheet: cheatsheet.md
      - Which technique?: which-technique.md
      - My mistakes: mistakes.md
  - Practice:
      - Mock midterm: practice/mock-midterm.md
  - About:
      - How this site works: how-this-site-works.md
